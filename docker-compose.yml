services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: vastu_reel_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-vastu_reel_db}
      MYSQL_USER: ${DB_USERNAME:-vastu_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root_password}
    ports:
      - "${DB_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_PASSWORD:-root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vastu_network

  # Database Management GUI (Adminer)
  adminer:
    image: adminer:latest
    container_name: vastu_reel_adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - vastu_network

  # Redis Cache & Queue Service
  redis:
    image: redis:7.2-alpine
    container_name: vastu_reel_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - vastu_network

  # Local S3 Storage (MinIO)
  minio:
    image: minio/minio:latest
    container_name: vastu_reel_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadminpassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - vastu_network

  # NestJS Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: vastu_reel_backend
    restart: always
    ports:
      - "${PORT:-8008}:8008"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-8008}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-vastu_user}
      DB_USER: ${DB_USERNAME:-vastu_user}
      DB_PASSWORD: ${DB_PASSWORD:-root_password}
      DB_DATABASE: ${DB_DATABASE:-vastu_reel_db}
      DB_NAME: ${DB_DATABASE:-vastu_reel_db}
      DB_SYNCHRONIZE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_CLIENT_ENDPOINT: http://localhost:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadminpassword}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-vastu-video}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - vastu_network

  # React Admin Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vastu_frontend
    restart: always
    ports:
      - "3000:5173"
      # - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8008/api/v1
      REACT_APP_API_URL: http://localhost:8008/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - vastu_network

networks:
  vastu_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  minio_data:
    driver: local
