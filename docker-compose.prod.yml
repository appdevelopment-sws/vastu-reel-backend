services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: vastu_reel_mysql_prod
    restart: always
    env_file:
      - ./backend/.env.prod
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - vastu_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # Redis Cache & Queue Service
  # ============================================================================
  redis:
    image: redis:7.2-alpine
    container_name: vastu_reel_redis_prod
    restart: always
    env_file:
      - ./backend/.env.prod
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        else
          redis-server --appendonly yes
        fi
      '
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vastu_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # NestJS Production Backend API Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile.prod
    container_name: vastu_reel_backend_prod
    restart: always
    env_file:
      - ./backend/.env.prod
    ports:
      - "3002:8008"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vastu_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # React Vite Frontend & Nginx Proxy
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.prod
      args:
        - VITE_API_URL=/api
    container_name: vastu_reel_frontend_prod
    restart: always
    ports:
      - "8000:80"
    depends_on:
      - backend
    networks:
      - vastu_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ==============================================================================
# Networks & Persistent Volumes
# ==============================================================================
networks:
  vastu_prod_network:
    driver: bridge

volumes:
  mysql_prod_data:
    driver: local
  redis_prod_data:
    driver: local
